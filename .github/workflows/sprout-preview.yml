name: Sprout preview checks
on:
  push:
    branches:
      - feature/sprout-learning-redesign
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check learning.js
          node --check supabase.js
          node --check trading.js
          node --check server.js
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify deployment files
        run: |
          test -s dist/index.html
          test -s dist/learning.js
          test -s dist/app.js
          test -s dist/supabase.js
